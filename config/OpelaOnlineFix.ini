; ==============================================================================
; OpelaOnlineFix Runtime Configuration
; ==============================================================================

[Main]
; Target game Steam Application ID
RealAppId=4218620

; Emulated Steam Application ID (480 = Spacewar default)
FakeAppId=480

; Automatically unlock all downloadable content queries
UnlockAllDLC=1

; Fallback original library path if chaining calls
OriginalLibrary=steam_api64_o.dll

[Diagnostics]
; Enable diagnostic file logging (1 = enabled, 0 = disabled)
EnableLogging=1

; Output log filename in the working directory
LogFile=opela.log

[Interfaces]
Apps=1
User=1
Utils=1
Storage=1
UserStats=1
Friends=1
Matchmaking=1
Networking=1
